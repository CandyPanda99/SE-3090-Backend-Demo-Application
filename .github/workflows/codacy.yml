# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

# It then runs the test suite with coverage instrumentation and uploads the
# report to Codacy, which turns it into the repository coverage metrics and the
# per-pull-request coverage diff. For the supported report formats and the
# upload contract, see https://docs.codacy.com/coverage-reporter/.

name: Codacy

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '45 14 * * 6'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  codacy-coverage-reporter:
    # Coverage is attached to a commit SHA, so the weekly scheduled run would
    # only re-upload the report that the last push already sent.
    if: github.event_name != 'schedule'
    permissions:
      contents: read # for actions/checkout to fetch code
    name: Codacy Coverage Reporter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BackendApplication.sln

      - name: Build
        run: dotnet build BackendApplication.sln --configuration Release --no-restore

      # Coverlet runs as a data collector inside the test host and writes one
      # OpenCover report per test project under ./coverage. This requires every
      # test project to reference the `coverlet.collector` package, otherwise
      # the collector is not found and no report is produced. The report format
      # and the exclusions live in coverlet.runsettings, so a local run produces
      # exactly what this job uploads.
      - name: Run tests with coverage
        run: >
          dotnet test BackendApplication.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory coverage

      # The collector nests each report in a random per-run GUID directory, so
      # resolve the real paths into the comma-separated list the reporter wants.
      - name: Locate coverage reports
        id: coverage
        run: |
          reports="$(find coverage -name 'coverage.opencover.xml' | sort | paste -sd, -)"
          if [ -z "$reports" ]; then
            echo "::error::dotnet test produced no OpenCover report under ./coverage"
            exit 1
          fi
          echo "Found coverage reports: $reports"
          echo "reports=$reports" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          # Same repository token as the analysis job above.
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage.outputs.reports }}
          # OpenCover XML is also emitted by other .NET tools, so name the
          # parser instead of relying on format detection.
          force-coverage-parser: opencover

      # Keeps the raw report available for debugging a coverage number that
      # does not match what Codacy shows.
      - name: Upload coverage report as an artifact
        if: always() && steps.coverage.outputs.reports != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-opencover
          path: coverage/**/coverage.opencover.xml
          if-no-files-found: ignore
